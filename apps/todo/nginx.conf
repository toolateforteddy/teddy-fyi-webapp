worker_processes  5;  ## Default: 1
worker_rlimit_nofile 8192;

# This file REPLACES the image's own /etc/nginx/nginx.conf, including the
# unprivileged base image's pid/temp relocations -- so they have to be restated
# here. The container runs as uid 101 with a read-only root filesystem, and the
# compiled-in defaults (/var/run/nginx.pid, /var/cache/nginx/*_temp) are both
# unwritable to it. Everything nginx needs to write goes under /tmp, which is
# the single writable mount in k8s/todo.yaml.
pid /tmp/nginx.pid;

events {
  worker_connections  4096;  ## Default: 1024
}

http {
  index    index.html;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  include       mime.types;

  # The access log, which is also the site's analytics. One JSON line per request on
  # stdout; GKE ships stdout to Cloud Logging, where each line becomes a jsonPayload,
  # and log-based metrics count page views out of them (the metrics, the dashboard and
  # the queries live in teddyfyi's analytics/ directory). Nothing runs in the browser.
  #
  # It is kept thin on purpose, and the same block is in teddyfyi's, website's and
  # teddy-fyi-webapp's grocery and todo nginx.conf so one metric filter reads them all:
  #   - no client address. Behind the load balancer $remote_addr is the LB's own, and
  #     the real one is not wanted.
  #   - the path and never the query string, in the request and the referer alike.
  #     Invite tokens travel as query strings, and this log is kept for 30 days.
  #   - the country, from the X-Client-Region header the load balancer adds (see the
  #     BackendConfig), and nothing finer.
  #   - no health checks. kube-probe and the load balancer's GoogleHC hit `/` every few
  #     seconds, which would be most of the log and none of the visitors.
  #
  # Like grocery's copy, this one adds what the others do not need: an invite link carries
  # its token in the path rather than the query, so that path is logged with the token cut
  # off. First match wins in a map, so it sits above the general rule.
  map $request_uri $log_path {
    "~^/invite/"  /invite/*;
    "~^([^?]*)"   $1;
  }
  map $http_referer $log_referer {
    "~^([^?#]*)"  $1;
  }
  map $http_user_agent $log_request {
    "~^kube-probe/"  0;
    "~^GoogleHC/"    0;
    default          1;
  }
  log_format   analytics escape=json
    '{"kind":"access","host":"$host","method":"$request_method","path":"$log_path",'
    '"status":$status,"type":"$sent_http_content_type","bytes":$body_bytes_sent,'
    '"referer":"$log_referer","ua":"$http_user_agent","region":"$http_x_client_region",'
    '"seconds":$request_time}';
  access_log   /dev/stdout analytics if=$log_request;
  sendfile     on;
  tcp_nopush   on;

  # Nothing in front of this pod compresses: the load balancer has no Cloud CDN,
  # and without it GCLB passes bytes through as they are. So without these lines
  # the ~360 KB bundle goes over the wire at full size rather than ~115 KB, on every
  # first visit and every deploy. text/html is always on and must not be listed.
  gzip              on;
  gzip_vary         on;
  gzip_proxied      any;
  gzip_comp_level   6;
  gzip_min_length   1024;
  gzip_types        text/css text/plain application/javascript application/json
                    application/manifest+json image/svg+xml;

  server {
    # 8080, not 80: a non-root process cannot bind a privileged port. The Service
    # in k8s/todo.yaml keeps port 80 (the ingress routes to it) and maps
    # targetPort to 8080 -- so this and the Deployment must move together.
    listen       8080 default;
    server_name  todo.teddy.fyi;

    root    /usr/share/nginx/html;

    # This origin serves one thing. None of teddy.fyi's waterfall belongs here:
    # no /resume user-agent sniff, no /pdf/ tree, no hand-written legacy pages
    # competing with SPA routes. Every path that is not a built asset is the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- THE ENTRY DOCUMENT MUST NOT BE CACHED ---
    # index.html is the one file every SPA route is served from, and it is the
    # only thing that names the current bundle. Served with no Cache-Control it
    # gets *heuristic* freshness -- roughly 10% of its age -- so a browser that
    # had loaded the app before a deploy keeps serving itself the old document
    # for hours, and with /assets/ immutable below it has that old bundle cached
    # too. The whole previous app then runs from disk: routes shipped since are
    # simply absent from it. Reshipping cannot fix that, because nothing is being
    # re-fetched. This bit us on teddy.fyi already.
    #
    # no-cache is "revalidate before use", not "do not store" -- the ETag still
    # makes the check a 304 whenever the deploy has not moved. try_files'
    # /index.html fallback is an internal redirect, so location matching re-runs
    # and this covers every SPA route, not just a literal request for
    # /index.html. That matters more here than it did on teddy.fyi, because this
    # app is installed to home screens: the entry document is what an installed
    # app revalidates on launch.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite content-hashes everything under /assets/, so the filename changes
    # whenever the contents do and these can be cached forever.
    location /assets/ {
        expires max;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # The installed-app metadata. Not content-hashed and not the entry document,
    # so it needs saying explicitly: an aggressively cached manifest is how an
    # installed app keeps an old name, icon or start_url after a deploy changes it.
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # --- THE SERVICE WORKER MUST NOT BE CACHED EITHER, AND FOR A HARDER REASON ---
    # sw.js is the only file a stuck client will still fetch over the network: the
    # browser checks it on navigation rather than serving it through the worker it
    # installs. That makes it the delivery route for the fleet kill switch
    # (VITE_DISABLE_SW=true, see DEPLOYMENT.md), and a cached copy is a kill switch
    # that cannot be thrown. Workbox inlines the precache manifest into this file, so
    # it changes on every build that changes any asset and is never worth caching.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Workbox's runtime, emitted next to sw.js rather than under /assets/, so the
    # immutable rule above does not reach it. It is content-hashed all the same.
    location ~ ^/workbox-[^/]+\.js$ {
        expires max;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
  }
}
