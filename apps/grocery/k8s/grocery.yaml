# grocery.teddy.fyi -- the grocery app's own front end.
#
# This repo owns the Service, the Deployment and the certificate, the same way
# teddy-fyi-api-rust and the ScribbleRoute website own theirs. What it does NOT
# own is the Ingress: `k8s/ingress.yaml` in the teddyfyi repo is the shared front
# door for every hostname on this load balancer, and it routes grocery.teddy.fyi
# here. Renaming grocery-svc is therefore a change in two repos, and the
# certificate below has to be named in that Ingress's
# `networking.gke.io/managed-certificates` annotation or it is never issued.
#
# Three placeholders are written by .github/workflows/deploy-grocery.yml before this
# is applied: IMAGE_TAG_PLACEHOLDER, BUNDLE_TAG_PLACEHOLDER and
# BUNDLE_SHA256_PLACEHOLDER. Do not put a moving tag in any of them: `:latest` is what
# cost teddy.fyi its rollback story and any record of what is live.
#
# The app is no longer in the image. The image is nginx plus nginx.conf, tagged with
# the hash of the files that compose it, so it is pushed only when one of them moves --
# an image push costs a flat vulnerability scan, and this app deploys several times a
# day against a container whose inputs change about twice a quarter. The app itself is
# a release asset that the init container below fetches and verifies at startup.
#
# The bundle tag lives in the pod template, as an environment variable rather than an
# annotation, and that is what keeps the rollback story intact: a new release changes
# the pod spec, so `kubectl apply` starts its own rollout, the Deployment's history has
# one revision per release, and `kubectl rollout undo` puts back a pod whose init
# container refetches the previous bundle.
apiVersion: v1
kind: Service
metadata:
  name: grocery-svc
  annotations:
    cloud.google.com/backend-config: '{"default": "grocery-be-config"}'
spec:
  selector:
    app: grocery
  ports:
    - name: http
      protocol: TCP
      # port stays 80: the ingress in teddyfyi routes to grocery-svc on 80 and
      # must not move. Only targetPort follows the container to its unprivileged
      # port. The BackendConfig below pins no health-check port, so the GCLB
      # health check follows targetPort too -- do not add one.
      port: 80
      targetPort: 8080
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grocery-dep
spec:
  # Two, where every other front end on this cluster runs one, and the init container
  # is the reason. The bundle fetch is deliberately fail-hard -- an empty docroot is
  # not one broken path here, it is the whole app -- so a bad pin or an unreachable
  # GitHub is a pod that never becomes ready. At one replica that is an outage. At two,
  # with maxUnavailable: 0 below, the existing pods keep serving and the deploy simply
  # stalls, which is what a failed deploy should look like. It also covers the case the
  # fetch really exists for: a node drain at 3am, when nothing is watching.
  replicas: 2
  # Spelled out rather than left to the percentage defaults, which at two replicas
  # round to one unavailable -- i.e. they would drop half the serving capacity mid-roll
  # and hand the guarantee above straight back.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  # A pod counts as available only once it has been Ready this long: the readiness
  # probe says nginx answered once, this says it kept answering.
  minReadySeconds: 10
  selector:
    matchLabels:
      app: grocery
  template:
    metadata:
      labels:
        app: grocery
    spec:
      # The image is nginxinc/nginx-unprivileged, which runs as uid/gid 101.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        # An emptyDir is created world-writable by the kubelet, so uid 101 should
        # be able to write /tmp/nginx.pid without this. But the site Deployment in
        # teddyfyi carries it for a reason: if the volume ever arrives root-owned
        # instead, nginx cannot write its pid file and the pod crash-loops on an
        # app that is otherwise fine. It costs a chown of one near-empty directory.
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      volumes:
      # nginx's pid file and every *_temp_path are pointed at /tmp in nginx.conf;
      # this is the only writable path in the container.
      - name: tmp
        emptyDir: {}
      # The unpacked app -- about a megabyte across twenty-odd files. On the node's
      # disk rather than in memory (`medium: Memory` would count against the
      # container's 128Mi limit). Its lifetime is the pod's, which is what makes the
      # fetch below run on every pod rather than once: a rescheduled pod rebuilds its
      # docroot from the release rather than inheriting anything.
      - name: bundle
        emptyDir: {}
      # Fetches the built app and verifies it against the hash the deploy pinned. This
      # is the same image as the container below -- there is no second image to keep
      # patched -- and it needs no credential of any kind, because this repo is public
      # and a release asset on a public repo is an ordinary redirect to storage.
      #
      # Every failure in here is fatal; see the comment on `replicas` above for why
      # that is safe and what it buys.
      initContainers:
      - name: fetch-bundle
        image: gcr.io/melodic-sunbeam-164916/teddy-fyi-grocery:IMAGE_TAG_PLACEHOLDER
        imagePullPolicy: IfNotPresent
        command: ["/usr/local/bin/fetch-bundle.sh"]
        env:
        # The release the deploy workflow published for this revision. This being in
        # the pod spec rather than in a ConfigMap is deliberate -- it is what makes a
        # new bundle a spec change, and therefore a real rollout with real history.
        - name: BUNDLE_URL
          value: https://github.com/toolateforteddy/teddy-fyi-webapp/releases/download/BUNDLE_TAG_PLACEHOLDER/grocery.tar.gz
        # Checked here even though the workflow that built the archive is the same one
        # that wrote this line: a release asset can be replaced in place without its
        # tag moving, and this unpacks into the document root of an origin that holds
        # a Google sign-in.
        - name: BUNDLE_SHA256
          value: BUNDLE_SHA256_PLACEHOLDER
        - name: BUNDLE_ROOT
          value: /bundle
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: bundle
          mountPath: /bundle
        # mktemp writes the archive here before it is verified, so this has to be the
        # writable volume rather than the read-only root filesystem.
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            # About the gunzip, not the download: the archive streams to disk.
            cpu: 500m
            memory: 128Mi
      containers:
      - name: grocery
        image: gcr.io/melodic-sunbeam-164916/teddy-fyi-grocery:IMAGE_TAG_PLACEHOLDER
        # The tag is the hash of the files the image is built from, so it can never
        # change meaning and there is nothing for `Always` to re-check.
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        # The docroot, out of the volume the init container filled. Read-only: nothing
        # nginx does should write to the app, and the init container finished before
        # this one started.
        - name: bundle
          mountPath: /usr/share/nginx/html
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /index.html
            port: 8080
          timeoutSeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /index.html
            port: 8080
          initialDelaySeconds: 15
          timeoutSeconds: 5
          periodSeconds: 15
---
# Named in teddyfyi's ingress.yaml annotation. A name listed there with no
# matching resource in the cluster silently costs a certificate, and a resource
# here that is not listed there is never issued -- so the two must land together.
#
# Provisioning order, once: the DNS record for grocery.teddy.fyi must point at the
# teddy-fyi-ip load balancer *before* the annotation naming this merges, because
# Google issues a managed certificate only after the name resolves there. Merge
# first and it sits in Provisioning. It fails alone: TLS breaks for this hostname
# and no other.
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: grocery-teddy-fyi-cert
spec:
  domains:
    - grocery.teddy.fyi
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: grocery-be-config
spec:
  healthCheck:
    checkIntervalSec: 30
    timeoutSec: 25
    type: HTTP
    # "/" is an SPA route that try_files answers with index.html, so it would work
    # -- but /index.html is the literal file and cannot become a redirect if the
    # routing ever changes.
    requestPath: /index.html
