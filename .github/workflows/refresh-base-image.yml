name: Refresh Base Image

# Opens a pull request that bumps the date in apps/grocery/base-refresh.txt and
# apps/todo/base-refresh.txt, which is how those two container images are asked to
# rebuild against a newer base. Both are the same nginx image shape, so they refresh
# together.
#
# This exists because of a trade the deploy workflow makes. That workflow tags the
# image with the hash of the files it is built from and skips the build entirely when
# that tag is already in the registry -- which is what stops an app-only merge paying
# for a container vulnerability scan it does not need. The thing it gives up is that
# the image used to be rebuilt several times a day as a side effect of shipping the
# app, and `FROM nginxinc/nginx-unprivileged:alpine` is a moving tag, so those rebuilds
# were also free Alpine and nginx patches. Skip the rebuild and the running nginx
# quietly freezes at whenever nginx.conf last changed.
#
# So the refresh becomes deliberate and scheduled instead of accidental and
# merge-driven. base-refresh.txt is in the image's hash and in no build step: changing
# it changes the tag, the deploy builds with `pull: true`, and production gets a
# current base for exactly one scan. A quiet month now patches nginx where before it
# patched nothing.
#
# A pull request rather than a push straight to main, because that is how everything
# else lands here and the diff is worth seeing. Note that a pull request opened with
# GITHUB_TOKEN does not itself trigger other workflows, so this one arrives without
# check runs; merging it triggers the deploy normally, because the merge is yours.

on:
  schedule:
    # Monday morning, and not on the hour: GitHub queues :00 crons from the whole
    # platform at once and drops them under load.
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: 'read'

concurrency:
  group: refresh-base-image
  cancel-in-progress: false

jobs:
  refresh:
    name: Open the refresh pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: 'write'
      pull-requests: 'write'
    steps:
      - uses: actions/checkout@v7

      - name: Bump the date and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files="apps/grocery/base-refresh.txt apps/todo/base-refresh.txt"
          today="$(date -u +%F)"
          current="$(head -1 apps/grocery/base-refresh.txt)"

          stale=0
          for file in $files; do
            [ "$(head -1 "$file")" = "$today" ] || stale=1
          done
          if [ "$stale" -eq 0 ]; then
            echo "Every base-refresh.txt already reads $today; nothing to do."
            exit 0
          fi

          # One fixed branch, force-pushed: an unmerged refresh from last week is
          # superseded by this one rather than accumulating a pull request a week.
          branch=automation/base-refresh
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"

          # Only the first line is the date; everything below it is the explanation of
          # what the file is for and must survive.
          for file in $files; do
            printf '%s\n' "$today" > "$file.new"
            tail -n +2 "$file" >> "$file.new"
            mv "$file.new" "$file"
          done

          git add $files
          git commit --file=- <<COMMIT
          Rebuild the grocery and todo images against a fresh base

          Each app's base-refresh.txt is in its image's content hash and in no
          build step, so moving the date is how a rebuild against a current
          nginxinc/nginx-unprivileged:alpine is requested. Merging this makes the
          next deploy of each build and push one image, and pay one scan, instead
          of serving whatever base was current when its nginx.conf last changed.

          Opened by .github/workflows/refresh-base-image.yml.
          COMMIT
          git push --force origin "$branch"

          # An existing open pull request already points at this branch and has just
          # been updated by the push, so creating a second one would fail.
          open_prs="$(gh pr list --head "$branch" --state open --json number --jq 'length')"
          if [ "$open_prs" != "0" ]; then
            echo "The refresh pull request is already open and now carries $today."
            exit 0
          fi

          gh pr create \
            --head "$branch" \
            --base main \
            --title "Rebuild the grocery and todo images against a fresh base ($today)" \
            --body "$(printf '%s\n' \
              "Bumps \`apps/grocery/base-refresh.txt\` and \`apps/todo/base-refresh.txt\` (grocery's read \`$current\`) to \`$today\`." \
              "" \
              "Before: the grocery and todo images in production were built when their own files last changed, so the Alpine and nginx inside them are as old as those builds." \
              "" \
              "After: each file is part of its image's content hash, so this changes the hash, and the next deploy of each app rebuilds with \`pull: true\` against a current \`nginxinc/nginx-unprivileged:alpine\` and pushes one new image for it." \
              "" \
              "How: opened weekly by \`.github/workflows/refresh-base-image.yml\`. Nothing in the app changes and no bundle is republished -- see DEPLOYMENT.md." )"
