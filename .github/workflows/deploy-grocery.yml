name: Deploy Grocery

# grocery.teddy.fyi deploys itself on merge. This is the thing the split was for:
# the grocery app ships weekly and should not need a laptop with Docker, a gcloud
# login and a kubectl context to do it.
#
# The personal site is deliberately NOT deployed from here. It still ships the old
# way -- `. cmd && dn` in the teddyfyi repo, which rsyncs apps/personal/dist into
# that repo's docroot -- because it changes a few times a year and its docroot is
# shared with hand-written pages and the resume PDFs that live over there.

on:
  push:
    branches: [main]
    # A change that cannot alter the bundle should not rebuild it or roll
    # production. The personal app and the repo's documentation are both common
    # edits here and neither is in this image.
    paths:
      - 'apps/grocery/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-grocery.yml'
      - '.github/workflows/ci.yml'
  # A manual button, for redeploying the current commit without an empty commit
  # to kick it -- e.g. after changing something in the cluster by hand.
  workflow_dispatch:

permissions:
  contents: 'read'

# Deploys are serialised, never cancelled. Two merges a minute apart must not race
# to `kubectl apply`, and cancelling the older one mid-rollout would leave the
# cluster half-way through a ReplicaSet swap with nothing watching it.
concurrency:
  group: deploy-grocery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The gate: the whole of CI -- lint, the 66 tests, both app builds -- rather
  # than a weaker copy of it inline here.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  # Fails fast and legibly when the Workload Identity configuration is missing.
  # Without it, the first thing that goes wrong is google-github-actions/auth
  # saying "the GitHub Action workflow must specify exactly one of
  # workload_identity_provider or credentials_json" -- which reads like the
  # workflow is malformed, when the workflow is fine and the value it
  # interpolated was simply empty. That exact error cost a debugging round on
  # this workflow's first run, when the credential it wanted did not exist.
  #
  # These are repository *variables*, not secrets, and deliberately so: under
  # Workload Identity Federation there is no secret material to hold. A provider
  # resource name and a service account email are not credentials -- the trust is
  # in the IAM binding, which names this repository.
  preflight:
    name: Check deploy configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the Workload Identity variables
        # Passed through env rather than interpolated into the script, so the
        # values are shell data and not shell source.
        env:
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
        run: |
          missing=0
          if [ -z "$WIF_PROVIDER" ]; then
            echo "::error::Repository variable GCP_WIF_PROVIDER is not set. Expected the full provider resource name: projects/34718544535/locations/global/workloadIdentityPools/github-pool/providers/github-provider (34718544535 is the project number, not the project ID)"
            missing=1
          fi
          if [ -z "$DEPLOY_SA" ]; then
            echo "::error::Repository variable GCP_DEPLOY_SA is not set. Expected the deployer service account email, e.g. grocery-deployer@melodic-sunbeam-164916.iam.gserviceaccount.com"
            missing=1
          fi
          if [ "$missing" -eq 0 ]; then
            echo "Workload Identity configuration present."
          fi
          exit $missing

  # Built in parallel with the gate, because the image is tagged with the commit
  # SHA only. An image built for a revision whose tests then fail is an
  # unreferenced blob in the registry that the deploy job below never reaches,
  # which is what makes starting it early safe. It would not be safe if this
  # pushed a moving tag like :latest, which someone could still pull.
  image:
    name: Build and Push Image
    # Nothing expensive should run before we know the deploy can authenticate.
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The Dockerfile copies apps/grocery/dist rather than building inside the
      # image: the build needs the workspace root (the lockfile, packages/shared),
      # and a Docker context that wide would ship the whole monorepo into the
      # build. Building here and copying the output keeps the image context to
      # one directory.
      - name: Build the grocery app
        run: pnpm --filter grocery build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: docker/setup-buildx-action@v3

      - name: Configure Docker
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/grocery
          push: true
          tags: gcr.io/melodic-sunbeam-164916/teddy-fyi-grocery:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    # Both, and in this order of importance: nothing reaches the cluster until the
    # gate is green, and there is no point applying a manifest naming an image
    # that has not been pushed.
    needs: [ci, image]
    timeout-minutes: 15
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: prod
          location: us-central1-a
          project_id: melodic-sunbeam-164916

      # The manifest names :IMAGE_TAG_PLACEHOLDER rather than a tag that moves, so
      # the revision being deployed is written into it here, in the workspace,
      # before anything is applied.
      #
      # The check afterwards is the part that matters: a manifest reaching the
      # cluster with the placeholder still in it fails to pull, and it should fail
      # here instead -- loudly, before apply, with the file named. Both the
      # substitution and the check are restricted to `image:` lines, because the
      # manifest also *mentions* the placeholder in the comment explaining it.
      - name: Pin the manifest to this revision
        run: |
          sed -i "/^[[:space:]]*image:/s|IMAGE_TAG_PLACEHOLDER|${{ github.sha }}|g" apps/grocery/k8s/*.yaml
          if grep -rnE '^[[:space:]]*image:.*IMAGE_TAG_PLACEHOLDER' apps/grocery/k8s/; then
            echo "::error::an image: line still carries IMAGE_TAG_PLACEHOLDER after substitution"
            exit 1
          fi
          grep -rnE '^[[:space:]]*image:' apps/grocery/k8s/

      # Note what is not here: `kubectl rollout restart`. With the image pinned to
      # the SHA, the spec change *is* the new image, so apply starts the rollout by
      # itself and a restart would only add a second, redundant one. The trade is
      # that re-running this on an unchanged commit is a no-op rather than a
      # rolling restart -- which is right, but means a config changed outside git
      # needs a deliberate `kubectl rollout restart deployment/grocery-dep`.
      #
      # This does not apply the Ingress: that is teddyfyi's, and a resource applied
      # from two repos flaps between whatever each one last said.
      - name: Apply Kubernetes Manifests
        run: kubectl apply -f apps/grocery/k8s/

      - name: Wait for the rollout
        # Without this the job is green the moment the change is *accepted*, so a
        # crash-looping image reports a successful deploy. `rollout status` blocks
        # until the new ReplicaSet is actually available and exits non-zero if it
        # never gets there.
        run: kubectl rollout status deployment/grocery-dep --timeout=5m
